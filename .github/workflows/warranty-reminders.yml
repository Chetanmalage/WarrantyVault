name: Warranty reminders

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected reminder endpoint
        shell: bash
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
          REMINDER_API_URL: ${{ vars.REMINDER_API_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${REMINDER_CRON_SECRET:-}" ]]; then
            echo "The REMINDER_CRON_SECRET Actions secret is not configured."
            exit 1
          fi
          if [[ -z "${REMINDER_API_URL:-}" ]]; then
            echo "The REMINDER_API_URL Actions variable is not configured."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer ${REMINDER_CRON_SECRET}" \
            --header 'Accept: application/json' \
            "${REMINDER_API_URL}")"

          if [[ "$status" != "200" ]]; then
            echo "Reminder endpoint returned HTTP ${status}."
            exit 1
          fi

          jq '{usersChecked, emailsSent, emailsPreviewed, productsNotified, skipped, failed, blockedReason}' "$response_file"
